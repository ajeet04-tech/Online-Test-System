{% extends 'main.html' %}

{% block title %} OTS-Login {% endblock title%}
{% block top %}
<a href="{% url 'OTS:registrationForm' %}">SignUp</a>
{% endblock %}
{% block content %}
<div class="all-forms">
    <div class="login-heading">
    <div class="login-logo">🎓 </div>
    <h2>Login to OTS</h2>
</div>
    <form action="{% url 'OTS:login' %}" method="post">
        {% csrf_token %}
        <div class="forms-unit">
            <label for="username">Username</label>
            <input type="text" name="username">
        </div>
        <div class="forms-unit">
            <label for="password">Password</label>
            <input type="password" name="password">
        </div>
        <div class="forms-unit">
            <input type="submit" value="Login">
            <input type="reset" value="Clear">
        </div>

    </form>
    New User <a href="{% url 'OTS:registrationForm' %}">Click here</a>
</div>

{% endblock %}

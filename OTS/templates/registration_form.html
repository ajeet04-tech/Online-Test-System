{% extends 'main.html' %}

{% block title %} OTS-Registration form {% endblock title%}
{% block top %}

<a href="{% url 'OTS:login' %}">Login</a>
{% endblock %}
{% block content %}
<div class="all-forms">
    <div class="login-heading">
    <div class="login-logo">🎓 </div>
    <h2>Register to OTS</h2>
    <p>Create your account to start online examinations.</p>
</div>
     <form action="{% url 'OTS:storeCandidate' %}" method="post">
         {% csrf_token %}

    <input type="text" name="name" placeholder="Full Name" required><br><br>

    <input type="text" name="username" placeholder="Username" required><br><br>

    <input type="password" name="password" placeholder="Password" required><br><br>

    <button type="submit">Register</button>
    <button type="reset">reset</button> 

      
     </form>
     Already have an account,<a href="{% url 'OTS:login' %}">Click Here</a>
</div>

{% endblock %}
